<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>星界轉珠｜手機版</title><style>
*{box-sizing:border-box}html,body{margin:0;overscroll-behavior:none;background:#090d21;color:white;font-family:system-ui,"PingFang TC",sans-serif;touch-action:manipulation}body{min-height:100dvh;background:radial-gradient(ellipse at 50% 15%,#243362,#080c1b 70%)}main{max-width:470px;margin:auto;padding:env(safe-area-inset-top) 12px max(env(safe-area-inset-bottom),14px)}header{display:flex;justify-content:space-between;align-items:center;padding:8px 2px}h1{margin:0;font-size:22px;letter-spacing:2px}.small{font-size:12px;color:#b3c6f2}.panel{background:#111b39cc;border:1px solid #475987;border-radius:18px;padding:12px;margin:8px 0;box-shadow:0 4px 25px #01030b55}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.bar{height:15px;background:#121426;border:1px solid #536485;border-radius:20px;overflow:hidden;flex:1}.fill{height:100%;transition:width .35s;background:linear-gradient(90deg,#e94785,#ff9c76)}#enemybar{background:linear-gradient(90deg,#8a38d5,#e9509b)}#enemy{font-size:64px;text-align:center;height:92px;line-height:90px;filter:drop-shadow(0 7px 12px #0009);animation:float 2s ease-in-out infinite alternate}@keyframes float{to{transform:translateY(-6px)}}#board{width:100%;display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:6px;border-radius:15px;background:#040b1c;border:2px solid #6778ac;touch-action:none;user-select:none;-webkit-user-select:none} .orb{aspect-ratio:1;border-radius:13px;display:grid;place-items:center;font-size:clamp(23px,7.3vw,40px);box-shadow:inset 0 3px 6px #fff5,inset 0 -6px 9px #0006,0 2px 5px #0007;border:1px solid #ffffff33;touch-action:none;transition:filter .12s}.orb.sel{outline:3px solid #fff;filter:brightness(1.35)}.t0{background:linear-gradient(135deg,#ffb34a,#bd182b)}.t1{background:linear-gradient(135deg,#80eaff,#194ec0)}.t2{background:linear-gradient(135deg,#a9ff92,#168d54)}.t3{background:linear-gradient(135deg,#fff9a7,#d5a730)}.t4{background:linear-gradient(135deg,#dfadff,#5a24a8)}.t5{background:linear-gradient(135deg,#ffb4dc,#d84e86)}.pill{display:inline-block;border-radius:100px;padding:5px 10px;background:#324477;color:#e0ecff;font-size:12px}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}button{font:inherit;border:0;cursor:pointer;color:white} .skill{background:linear-gradient(150deg,#394e89,#182548);border:1px solid #7184b3;border-radius:13px;padding:8px 1px;font-size:12px;min-height:58px}.skill:disabled{opacity:.43}.skill b{display:block;font-size:22px;margin-bottom:3px}.primary{width:100%;border-radius:14px;background:linear-gradient(90deg,#7b53e5,#ec58a4);padding:12px;font-size:17px;font-weight:bold;margin-top:8px}#msg{min-height:36px;text-align:center;line-height:1.4;padding:5px;color:#ffe3a2;font-weight:600}#combo{font-weight:900;font-size:19px;color:#ffe47c} .footer{text-align:center;color:#92a6d0;font-size:12px;margin:8px 0 12px}</style></head><body><main><header><div><h1>✨ 星界轉珠</h1><div class="small">命運連鎖 · 觸控冒險 RPG</div></div><span class="pill" id="level">第 1 / 8 關</span></header><section class="panel"><div class="row"><b id="enemyname">暗影史萊姆</b><span id="enemyhptext">HP 100</span></div><div class="bar" style="margin-top:8px"><div class="fill" id="enemybar" style="width:100%"></div></div><div id="enemy">👾</div><div class="row"><span class="pill" id="turns">敵人攻擊倒數：3</span><span id="combo">連擊 x0</span></div></section><section class="panel"><div class="row"><b>❤️ 隊伍生命</b><b id="hptext">1200 / 1200</b></div><div class="bar" style="margin-top:6px"><div class="fill" id="hpbar" style="width:100%"></div></div><div id="msg">按住寶珠拖動，鬆開後開始攻擊！</div><div id="board" aria-label="轉珠盤面"></div><div class="small" style="text-align:center;margin-top:7px">玩法：按住拖曳轉珠（或依序點選相鄰兩珠）</div></section><section class="panel"><div class="row" style="margin-bottom:8px"><b>⚔️ 英雄技能</b><span class="small" id="energy">技能能量：0</span></div><div class="actions"><button class="skill" data-s="0"><b>🔥</b>烈焰 5</button><button class="skill" data-s="1"><b>💧</b>治療 4</button><button class="skill" data-s="2"><b>⚡</b>雷擊 6</button><button class="skill" data-s="3"><b>🌈</b>洗珠 3</button></div><button class="primary" id="reset">重新開始冒險</button></section><div class="footer">本遊戲會在瀏覽器內運行 · 無須安裝</div></main><script>
(function(){'use strict';const board=document.getElementById('board'), icons=['🔥','💧','🌿','✨','🌑','💗'],names=['暗影史萊姆','冰霜哥布林','熔岩守衛','森林魔像','雷鳴巨鷹','深淵巨蛇','月蝕騎士','星界魔王'],faces=['👾','👹','🗿','🌳','🦅','🐍','🥷','🐉'];let grid=[],lvl=0,hp=1200,enemyHp=100,maxEnemy=100,countdown=3,energy=0,playing=true,drag=false,last=-1,selected=-1,ignoreClick=false,busy=false;const $=x=>document.getElementById(x),rand=()=>Math.floor(Math.random()*6),idx=(r,c)=>r*6+c;
function fillBoard(){grid=Array.from({length:30},rand);for(let r=0;r<5;r++)for(let c=0;c<6;c++){let i=idx(r,c);while((c>1&&grid[i]===grid[i-1]&&grid[i]===grid[i-2])||(r>1&&grid[i]===grid[i-6]&&grid[i]===grid[i-12]))grid[i]=rand();}}
function render(){board.innerHTML='';grid.forEach((t,i)=>{let d=document.createElement('div');d.className='orb t'+t+(i===selected?' sel':'');d.textContent=icons[t];d.dataset.i=i;board.appendChild(d)});$('level').textContent='第 '+(lvl+1)+' / 8 關';$('enemyname').textContent=names[lvl];$('enemy').textContent=faces[lvl];$('enemyhptext').textContent='HP '+Math.max(0,enemyHp);$('enemybar').style.width=Math.max(0,100*enemyHp/maxEnemy)+'%';$('hptext').textContent=Math.max(0,hp)+' / 1200';$('hpbar').style.width=Math.max(0,100*hp/1200)+'%';$('turns').textContent='敵人攻擊倒數：'+countdown;$('energy').textContent='技能能量：'+energy;document.querySelectorAll('.skill').forEach((b,i)=>b.disabled=!playing||busy||energy<[5,4,6,3][i]);}
function message(s){$('msg').textContent=s}function near(a,b){return a>=0&&b>=0&&((Math.floor(a/6)===Math.floor(b/6)&&Math.abs(a-b)===1)||Math.abs(a-b)===6)}function swap(a,b){[grid[a],grid[b]]=[grid[b],grid[a]];render()}
function matches(){let set=new Set();for(let r=0;r<5;r++){let c=0;while(c<6){let e=c+1;while(e<6&&grid[idx(r,e)]===grid[idx(r,c)])e++;if(e-c>=3)for(let x=c;x<e;x++)set.add(idx(r,x));c=e;}}for(let c=0;c<6;c++){let r=0;while(r<5){let e=r+1;while(e<5&&grid[idx(e,c)]===grid[idx(r,c)])e++;if(e-r>=3)for(let y=r;y<e;y++)set.add(idx(y,c));r=e;}}return set}
function gravity(found){for(let c=0;c<6;c++){let kept=[];for(let r=4;r>=0;r--)if(!found.has(idx(r,c)))kept.push(grid[idx(r,c)]);for(let r=4,k=0;r>=0;r--,k++)grid[idx(r,c)]=k<kept.length?kept[k]:rand();}}
function hit(d){enemyHp-=d;if(enemyHp<=0){if(lvl===7){playing=false;message('🏆 恭喜！你已通關全部 8 關！');$('combo').textContent='完美通關';render();return true;}lvl++;maxEnemy=100+lvl*80;enemyHp=maxEnemy;countdown=3;hp=Math.min(1200,hp+180);message('🎉 過關！迎戰 '+names[lvl]);render();return true;}return false}
function enemyTurn(){if(!playing)return;countdown--;if(countdown<=0){let dmg=95+lvl*32;hp=Math.max(0,hp-dmg);countdown=3;if(!hp){playing=false;message('💔 冒險失敗，點擊重新開始！');}else message('敵人反擊！受到 '+dmg+' 傷害');}}
function resolve(){if(!playing||busy)return;busy=true;selected=-1;let combo=0,total=0,healed=0;for(let pass=0;pass<16;pass++){let set=matches();if(!set.size)break;combo++;for(let i of set){if(grid[i]===5)healed+=22;else total+=14+lvl*2;}gravity(set);}if(combo){total=Math.round(total*(1+(combo-1)*.35));energy=Math.min(20,energy+Math.max(1,combo));hp=Math.min(1200,hp+healed);$('combo').textContent='連擊 x'+combo;let victory=hit(total);if(!victory){message('✨ '+combo+' 連擊！造成 '+total+' 傷害'+(healed?'，回復 '+healed+' HP':''));enemyTurn();}}else{message('沒有消除，敵人回合推進');enemyTurn();$('combo').textContent='連擊 x0';}busy=false;render();}
function indexAt(e){let el=document.elementFromPoint(e.clientX,e.clientY);let orb=el&&el.closest('.orb');return orb&&board.contains(orb)?Number(orb.dataset.i):-1}
board.addEventListener('pointerdown',e=>{if(!playing||busy)return;let i=indexAt(e);if(i<0)return;drag=true;last=i;ignoreClick=false;board.setPointerCapture(e.pointerId);e.preventDefault();});
board.addEventListener('pointermove',e=>{if(!drag||!playing)return;let i=indexAt(e);if(near(last,i)){swap(last,i);last=i;ignoreClick=true;}e.preventDefault();});
board.addEventListener('pointerup',e=>{if(!drag)return;drag=false;if(ignoreClick){selected=-1;resolve();}else{let i=last;if(selected>=0&&near(selected,i)){swap(selected,i);selected=-1;resolve();}else{selected=(selected===i?-1:i);render();}}e.preventDefault();});
board.addEventListener('pointercancel',()=>{if(drag){drag=false;selected=-1;resolve();}});
document.querySelectorAll('.skill').forEach(btn=>btn.addEventListener('click',()=>{let s=Number(btn.dataset.s),cost=[5,4,6,3][s];if(!playing||busy||energy<cost)return;energy-=cost;if(s===0){hit(180+lvl*30);message('🔥 烈焰爆發！')}if(s===1){hp=Math.min(1200,hp+400);message('💧 回復 400 生命！')}if(s===2){hit(300+lvl*35);message('⚡ 雷擊重創敵人！')}if(s===3){fillBoard();message('🌈 寶珠重新排列！')}render();}));
$('reset').addEventListener('click',()=>{lvl=0;hp=1200;maxEnemy=100;enemyHp=100;countdown=3;energy=0;playing=true;busy=false;selected=-1;fillBoard();$('combo').textContent='連擊 x0';message('準備好了！開始轉珠吧！');render()});
fillBoard();render();})();
</script></body></html>
